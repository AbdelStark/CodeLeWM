[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codelewm"
version = "0.0.0"
description = "Latent transition models for Python code edit trajectories."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "CodeLeWM maintainers"}
]
keywords = [
  "code-editing",
  "jepa",
  "latent-dynamics",
  "world-models"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed"
]
dependencies = [
  "einops>=0.7",
  "hydra-core>=1.3",
  "lightning>=2.2",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "scikit-learn>=1.3",
  "stable-pretraining",
  "stable-worldmodel[env,train]",
  "torch>=2.1",
  "torchvision>=0.16"
]

[project.optional-dependencies]
data = [
  "h5py>=3.10",
  "pyarrow>=15"
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "tomli>=2; python_version < '3.11'"
]

[project.urls]
Repository = "https://github.com/AbdelStark/CodeLeWM"
Issues = "https://github.com/AbdelStark/CodeLeWM/issues"

[project.scripts]
codelewm = "codelewm.harness.cli:main"

[tool.setuptools.packages.find]
include = ["codelewm*"]
