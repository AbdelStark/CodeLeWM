[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codelewm"
version = "0.0.0"
description = "Latent transition models for Python code edit trajectories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "CodeLeWM maintainers"}
]
keywords = [
  "code-editing",
  "jepa",
  "latent-dynamics",
  "world-models"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed"
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
data = [
  "h5py>=3.10",
  "pyarrow>=15"
]
train = [
  "einops>=0.7",
  "hydra-core>=1.3",
  "lightning>=2.2",
  "omegaconf>=2.3",
  "stable-pretraining",
  "stable-worldmodel[train]",
  "torch>=2.1",
  "torchvision>=0.16"
]
eval = [
  "scikit-learn>=1.3"
]
docs = [
  "pytest>=8"
]
release = [
  "build>=1.2",
  "twine>=5"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "tomli>=2; python_version < '3.11'"
]
data = [
  "h5py>=3.10",
  "pyarrow>=15"
]
train = [
  "einops>=0.7",
  "hydra-core>=1.3",
  "lightning>=2.2",
  "omegaconf>=2.3",
  "stable-pretraining",
  "stable-worldmodel[train]",
  "torch>=2.1",
  "torchvision>=0.16"
]
eval = [
  "scikit-learn>=1.3"
]
docs = [
  "pytest>=8"
]
release = [
  "build>=1.2",
  "twine>=5"
]

[project.urls]
Repository = "https://github.com/AbdelStark/CodeLeWM"
Issues = "https://github.com/AbdelStark/CodeLeWM/issues"

[project.scripts]
codelewm = "codelewm.harness.cli:main"

[tool.setuptools.packages.find]
include = ["codelewm*"]

[tool.setuptools.package-data]
codelewm = ["py.typed"]
