# CPU bounded scaled rehearsal profile.
# Budget: 2k steps, batch 8, float32, expected 6-18h on an 8-12 core CPU
# for a 25k-50k row shard; memory target 8-12 GiB; artifact target 1-3 GiB.
schema_version: codelewm.train_config.v1
name: codelewm_scaled_cpu
seed: 240119

data:
  train: data/codelewm_public_shard_v0_3/hdf5/train.hdf5
  val: data/codelewm_public_shard_v0_3/hdf5/val.hdf5
  manifest: data/codelewm_public_shard_v0_3/manifest.json

wm:
  history_size: 1
  num_preds: 1
  embed_dim: 256
  action_view: text
  state_sequence_length: 1024
  action_sequence_length: 256

trainer:
  max_steps: 2048
  accelerator: cpu
  devices: 1
  precision: float32
  gradient_clip_val: 1.0

loader:
  batch_size: 8
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false

optimizer:
  type: AdamW
  lr: 0.0001
  weight_decay: 0.001

loss:
  sigreg_weight: 0.09
  enable_retrieval_loss: false
  retrieval_weight: 0.0
  retrieval_temperature: 0.1
  sigreg_knots: 17
  sigreg_num_proj: 1024

output:
  run_dir: runs/codelewm_scaled_cpu
  checkpoint_dir: runs/codelewm_scaled_cpu/checkpoints
  metrics_path: runs/codelewm_scaled_cpu/metrics.jsonl
  manifest_path: runs/codelewm_scaled_cpu/training_manifest.json
