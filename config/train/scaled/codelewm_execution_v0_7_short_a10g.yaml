# CodeLeWM v0.7 execution-substrate training profile (A10G, SHORT).
#
# Identical recipe to codelewm_execution_v0_7_a10g.yaml (the RFC-0015
# WS-C levers: transformer state encoder + InfoNCE retrieval + applied
# prediction_mse_weight) but with a right-sized step budget that is
# GUARANTEED to finish inside the HF Jobs 24h wall.
#
# Rationale: the WS-C1 transformer state encoder at seq-1024 is far more
# expensive per step than the v0.6 mean-pooling encoder, so the 50000-step
# full profile is borderline against the 24h timeout (a timeout = no
# artifact upload). 15000 steps is still ~2000 epochs over the 1859-record
# mbpp pack — ample for representation learning — and doubles as a
# training-duration ablation against the full run. Distinct run-name and
# checkpoint-revision templates keep its uploads from colliding with the
# 50k run's.

schema_version: codelewm.execution_train_config.v1
name: codelewm_execution_v0_7_short_a10g
substrate: execution_trace_v1
parent_issue: 259
implementing_issue: 339
target_substrate_run: v0.7.0

data:
  pack_repo_id: abdelstark/codelewm-execution-pack
  pack_revision: v0.7.0-rc1
  pack_jsonl: pack.jsonl
  manifest_filename: manifest.json
  claim_boundary_filename: claim_boundary.md
  ingestion_sources:
    - mbpp
  held_out_for_eval:
    - mbpp_plus
    - humaneval

loader:
  code_sequence_length: 1024
  action_sequence_length: 256
  output_sequence_length: 256
  batch_size: 64
  gradient_accumulation_steps: 4
  effective_batch_size: 256
  shuffle: true

trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_steps: 15000
  warmup_steps: 500
  cosine_decay_to: 0.0
  gradient_clip_val: 1.0
  checkpoint_every_n_steps: 5000
  keep_last_n_checkpoints: 3
  keep_best_by_metric: val_mse
  tensorboard_enabled: true
  collapse_diagnostics_every_n_steps: 1000

optimizer:
  name: adamw
  lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.1

wm:
  history_size: 1
  num_preds: 1
  embed_dim: 256
  state_encoder_type: transformer
  state_encoder_layers: 4
  state_encoder_heads: 8

objective:
  prediction_mse_weight: 1.0
  sigreg_weight: 0.09
  action_swap_contrastive_weight: 0.1
  inverse_action_reconstruction_weight: 0.05
  retrieval_weight: 0.05

seeds:
  - 42
  - 1729

hf_jobs:
  flavor: a10g-small
  region: us-east-1
  timeout_hours: 24
  run_name_template: codelewm-v0-7-short-execution-{date}-{sha}-seed-{seed}
  artifact_repo_id: abdelstark/codelewm-runs
  checkpoint_repo_id: abdelstark/codelewm-transition-model
  checkpoint_revision_template: v0.7.0-short-seed-{seed}
  runtime_image: ghcr.io/abdelstark/codelewm-runtime:v0.7-short

claim_gates:
  retrieval_min_recall_at_1_lift_over_no_action: 0.05
  retrieval_min_mrr_lift_over_no_action: 0.05
  collapse_effective_rank_ratio_min: 0.20
  collapse_per_dim_variance_median_min: 1.0e-8
  collapse_nearest_neighbor_entropy_min: 0.10
  surprise_mutation_auc_min: 0.65
  surprise_same_problem_different_submission_auc_min: 0.60
  surprise_same_code_different_input_auc_min: 0.70
  downstream_rerank_pass_at_1_lift_min: 3.0
  required_seeds: 2

claim_boundary:
  name: execution_substrate.v1
  scope: v0_7_full_run
